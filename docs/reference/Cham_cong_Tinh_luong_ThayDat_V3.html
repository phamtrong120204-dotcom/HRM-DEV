<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chấm công & Tính lương - Thầy Đạt Tin Học</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%229%22%20fill%3D%22%230f766e%22%2F%3E%3Cpath%20d%3D%22M8%2020l5-6%204%204%207-9%22%20fill%3D%22none%22%20stroke%3D%22%23fbbf24%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<style>
:root{--p:#0f766e;--pd:#115e59;--p50:#f0fdfa;--p100:#ccfbf1;--ink:#042f2e;--acc:#f59e0b;--line:#e2e8f0}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Segoe UI',Roboto,Arial,sans-serif;font-size:14px;color:#1e293b;background:#eef3f2;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pd)}
svg{flex:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes draw{to{stroke-dashoffset:0}}

/* ===== Khung: thanh trên cùng + tab ngang ===== */
.top{background:linear-gradient(100deg,var(--ink),var(--pd) 70%,var(--p));color:#fff;position:sticky;top:0;z-index:50;box-shadow:0 4px 18px rgba(4,47,46,.25)}
.top-in{max-width:1500px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:10px 24px;flex-wrap:wrap}
.brand{display:flex;gap:11px;align-items:center}
.brand .logo{width:40px;height:40px;border-radius:11px;background:var(--acc);color:var(--ink);display:grid;place-items:center}
.brand .logo svg{width:22px;height:22px}
.brand b{display:block;font-size:15.5px;line-height:1.2}
.brand small{font-size:11.5px;color:#99f6e4}
.tabs{display:flex;gap:4px;margin-left:10px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{display:flex;align-items:center;gap:7px;padding:9px 13px;border-radius:10px;color:#ccfbf1;text-decoration:none;cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap;transition:.15s}
.tabs a svg{width:16px;height:16px}
.tabs a:hover{background:rgba(255,255,255,.1);color:#fff}
.tabs a.on{background:#fff;color:var(--pd);box-shadow:0 3px 10px rgba(0,0,0,.2)}
.top-r{display:flex;align-items:center;gap:12px;margin-left:auto}
.ss{font-size:12px;color:#ccfbf1;display:flex;align-items:center;gap:7px;max-width:230px}
.ss i{width:8px;height:8px;border-radius:50%;background:#4ade80;flex:none}
.ss.dirty i{background:var(--acc);box-shadow:0 0 0 3px rgba(245,158,11,.3)}
.main{max-width:1500px;margin:0 auto;padding:20px 24px 30px}
.ph{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.ph h1{margin:0;font-size:22px;letter-spacing:-.01em;color:var(--ink)}
.ph p{margin:3px 0 0;color:#64748b;font-size:13px}
.tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.foot{max-width:1500px;margin:0 auto;padding:6px 24px 28px;text-align:center;color:#64748b;font-size:12.5px}
.foot b{color:var(--pd)}
.backdrop{display:none}

/* ===== Nút, ô nhập ===== */
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:9px;border:1px solid #cbd5d3;background:#fff;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;transition:.15s;text-decoration:none;color:#1e293b}
.btn:hover{border-color:var(--p);color:var(--pd)}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#451a03}
.btn.pri:hover{background:#d97706;border-color:#d97706;color:#fff}
.btn.xl{background:#16a34a;border-color:#16a34a;color:#fff}
.btn.xl:hover{background:#15803d;color:#fff}
.btn.danger{color:#dc2626;border-color:#fecaca}
.btn.danger:hover{background:#fef2f2;border-color:#dc2626;color:#b91c1c}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.ibtn{width:30px;height:30px;border-radius:8px;border:0;background:transparent;display:inline-grid;place-items:center;cursor:pointer;color:#64748b;vertical-align:middle}
.ibtn svg{width:16px;height:16px}
.ibtn:hover{background:var(--p50);color:var(--pd)}
.ibtn.del:hover{background:#fee2e2;color:#dc2626}
.inp{height:36px;border:1px solid #cbd5d3;border-radius:9px;padding:0 11px;background:#fff;outline:none;min-width:0;transition:border .15s,box-shadow .15s}
.inp:focus{border-color:var(--p);box-shadow:0 0 0 3px var(--p100)}
textarea.inp{height:auto;padding:9px 11px;min-height:76px;resize:vertical}
select.inp{padding-right:26px}
.inp.sm{height:30px;font-size:12.5px;border-radius:8px;padding:0 8px}
.inp.num{text-align:right;font-variant-numeric:tabular-nums}
.search{position:relative;display:inline-flex}
.search input{padding-left:34px;width:250px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:#94a3b8}
.mp{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:#334155;background:#fff;border:1px solid #cbd5d3;border-radius:9px;padding:0 8px 0 12px;height:36px}
.mp input{border:0;outline:none;background:transparent;height:32px}

/* ===== Thẻ, lưới ===== */
.grid{display:grid;gap:16px}
.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.c21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.mt{margin-top:16px}.mb{margin-bottom:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.muted{color:#64748b}.small{font-size:12.5px}
.r{text-align:right}.c{text-align:center}
.card{background:#fff;border-radius:14px;border:1px solid var(--line);box-shadow:0 1px 3px rgba(15,23,42,.05);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid #eef2f1;min-height:52px;flex-wrap:wrap}
.card-h h3{margin:0;font-size:14.5px}
.card-h .sub{color:#64748b;font-size:12.5px;margin-left:auto}
.card-b{padding:16px 18px}
.banner{display:flex;gap:12px;align-items:center;padding:11px 16px;border-radius:12px;background:var(--p50);border:1px solid var(--p100);margin-bottom:14px;flex-wrap:wrap}
.banner.warn{background:#fffbeb;border-color:#fde68a}
.banner svg{width:19px;height:19px;color:var(--p)}
.banner.warn svg{color:#d97706}
.empty{padding:36px 20px;text-align:center;color:#94a3b8}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:#f1f5f9;color:#475569;white-space:nowrap}
.b-green{background:#dcfce7;color:#15803d}.b-red{background:#fee2e2;color:#b91c1c}.b-amber{background:#fef3c7;color:#b45309}.b-p{background:var(--p50);color:var(--pd)}
.avatar{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;background:var(--p100);color:var(--pd);font-weight:700;font-size:12px;flex:none}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who b{display:block;font-weight:600}
.who small{color:#64748b;font-size:12px}

/* ===== Bảng ===== */
.tbl-card{background:#fff;border-radius:14px;border:1px solid var(--line);box-shadow:0 1px 3px rgba(15,23,42,.05);overflow:hidden}
.tbl-tools{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid #eef2f1;flex-wrap:wrap}
.tbl-wrap{overflow:auto;max-height:calc(100vh - 330px);min-height:180px}
.tbl-wrap.free{max-height:none}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.tbl th{position:sticky;top:0;background:#f4f8f7;text-align:left;font-weight:700;color:#475569;padding:10px 12px;border-bottom:1px solid #dfe7e5;white-space:nowrap;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;z-index:2}
.tbl td{padding:9px 12px;border-bottom:1px solid #eef2f1;vertical-align:middle;white-space:nowrap}
.tbl tbody tr:hover td{background:var(--p50)}
.tbl tbody tr.click{cursor:pointer}
.tbl th.r,.tbl td.r{text-align:right;font-variant-numeric:tabular-nums}
.tbl th.c,.tbl td.c{text-align:center}
.tbl tfoot td{font-weight:700;background:#f4f8f7;border-top:2px solid #dfe7e5;position:sticky;bottom:0;z-index:2}
.tbl th.sort{cursor:pointer;user-select:none}
.tbl th.sort:after{content:'↕';opacity:.3;margin-left:5px}
.tbl th.asc:after{content:'↑';opacity:1}.tbl th.desc:after{content:'↓';opacity:1}
.tbl td.act{text-align:right;width:1%}
.tbl.compact td{padding:7px 10px}.tbl.compact th{padding:8px 10px}
.tbl-pager{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:12.5px;color:#64748b;gap:10px;flex-wrap:wrap;border-top:1px solid #eef2f1}
.pg{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}
.pg select{margin:0 8px 0 4px}
.pg-n{min-width:30px;height:30px;padding:0 8px;border:1px solid #cbd5d3;background:#fff;border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:600;color:#475569}
.pg-n:hover:not(:disabled){border-color:var(--p);color:var(--pd)}
.pg-n.on{background:var(--p);border-color:var(--p);color:#fff}
.pg-n:disabled{opacity:.4;cursor:default}
.pg-dot{padding:0 4px;color:#94a3b8}

/* ===== Modal, form ===== */
.modal-wrap{position:fixed;inset:0;background:rgba(2,24,23,.5);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:100;overflow:auto;animation:fade .15s}
.modal{background:#fff;border-radius:16px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.3);animation:pop .18s}
.modal-h{display:flex;align-items:center;gap:10px;padding:15px 20px;border-bottom:1px solid #eef2f1}
.modal-h h3{margin:0;font-size:16px}
.modal-h .ibtn{margin-left:auto}
.modal-b{padding:18px 20px;max-height:72vh;overflow:auto}
.modal-f{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:13px 20px;border-top:1px solid #eef2f1;background:#f8fbfa;border-radius:0 0 16px 16px}
.modal-f .left{margin-right:auto}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.form.f3{grid-template-columns:repeat(3,minmax(0,1fr))}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:12.5px;font-weight:600;color:#334155}
.field.full{grid-column:1/-1}.field.s2{grid-column:span 2}
.field small{color:#94a3b8;font-size:11.5px}
.field .inp{width:100%}
.req{color:#ef4444;font-style:normal}
.fsec{grid-column:1/-1;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--pd);border-bottom:1px solid #eef2f1;padding-bottom:6px;margin-top:6px}
.img-pick{display:flex;gap:12px;align-items:center}
.img-pick .ph2{width:72px;height:72px;border-radius:12px;border:1px dashed #b6c2c0;display:grid;place-items:center;overflow:hidden;background:#f8fafc;color:#94a3b8;flex:none}
.img-pick .ph2 img{width:100%;height:100%;object-fit:contain}
#toasts{position:fixed;right:20px;bottom:20px;z-index:300;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:#0f172a;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:13.5px;max-width:400px;animation:pop .2s;border-left:4px solid var(--acc)}
.toast.ok{border-left-color:#22c55e}.toast.err{border-left-color:#ef4444}
#tip{position:fixed;pointer-events:none;background:#0f172a;color:#fff;font-size:12px;padding:6px 9px;border-radius:7px;z-index:400;white-space:pre;display:none;line-height:1.4}

/* ===== Biểu đồ, thẻ số liệu ===== */
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:#475569;margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.donut{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut svg{width:160px;height:160px}
.dl{flex:1;min-width:170px}
.dl div{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed #e8eeed;font-size:13px}
.dl div:last-child{border:0}
.dl i{width:10px;height:10px;border-radius:3px;flex:none}
.dl b{margin-left:auto;font-variant-numeric:tabular-nums}
.dl em{color:#94a3b8;font-style:normal;width:46px;text-align:right;font-size:12px}
.hb{margin:10px 0}
.hb-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;gap:10px}
.hb-bar{height:8px;background:#eef2f1;border-radius:99px;overflow:hidden}
.hb-bar i{display:block;height:100%;border-radius:99px}
.kc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 18px 0;overflow:hidden;box-shadow:0 1px 3px rgba(15,23,42,.05);position:relative}
.kc:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.kc-h{display:flex;align-items:center;gap:10px}
.kc-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--cb);color:var(--c);flex:none}
.kc-ic svg{width:18px;height:18px}
.kc-l{font-size:13px;color:#64748b;font-weight:600}
.kc-v{font-size:23px;font-weight:800;letter-spacing:-.5px;margin:10px 0 2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kc-v small{font-size:13px;color:#94a3b8}
.kc-s{font-size:12px;color:#64748b}
.spk{display:block;width:calc(100% + 36px);margin:8px -18px 0;height:42px}
.spk path.l,.arealine{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s .2s ease forwards}
.pill{margin-left:auto;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap}
.pill.pu{background:#dcfce7;color:#15803d}.pill.pd{background:#fee2e2;color:#b91c1c}.pill.na{background:#eef2f1;color:#64748b}
.stackbar rect{transform-box:fill-box;transform-origin:50% 100%;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
.medal{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;flex:none}
.tli{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed #e8eeed}
.tli:last-child{border:0}
.tli .grow{min-width:0}
.tli .grow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tli small{color:#64748b;font-size:12px}
.tli .pb{height:6px;background:#eef2f1;border-radius:6px;margin-top:5px;overflow:hidden}
.tli .pb i{display:block;height:100%;border-radius:6px}
.tli .v{text-align:right;font-weight:700;white-space:nowrap}
.tli .v small{display:block;font-weight:500}
.ring{text-align:center}
.ring svg{width:170px;height:170px;display:block;margin:0 auto}
.ring b{display:block;margin-top:8px}
.ring-n{stroke-dasharray:0 400;animation:ringin 1.2s .2s cubic-bezier(.2,.8,.2,1) forwards}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.spk path.l,.arealine{stroke-dashoffset:0}}

/* ===== Chấm công ===== */
.cc-wrap{overflow:auto;max-height:calc(100vh - 330px);background:#fff;border:1px solid var(--line);border-radius:14px 14px 0 0}
table.cc{border-collapse:separate;border-spacing:0;font-size:12px;user-select:none}
.cc th,.cc td{border-right:1px solid #eef2f1;border-bottom:1px solid #eef2f1;text-align:center;padding:0;height:34px}
.cc thead th{position:sticky;top:0;background:#f4f8f7;z-index:3;font-weight:700;color:#475569;font-size:11px;padding:4px 2px;line-height:1.2}
.cc thead th.we{background:#fff1f2;color:#e11d48}
.cc thead th.td{background:var(--p);color:#fff}
.cc .nm{position:sticky;left:0;background:#fff;z-index:2;text-align:left;padding:0 12px;min-width:190px;max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc thead .nm{z-index:4;background:#f4f8f7}
.cc td.d{width:32px;min-width:32px;cursor:pointer;font-weight:700;font-size:11px}
.cc td.d:hover{outline:2px solid var(--p);outline-offset:-2px}
.cc td.we{background:#fff7f8}
.cc td.sum{min-width:56px;padding:0 6px;font-weight:700;background:#f8fafc;font-variant-numeric:tabular-nums}
.cc td.sum.hl{background:var(--p50);color:var(--pd)}
.cc td.ot input{width:54px;height:26px;border:1px solid #cbd5d3;border-radius:6px;text-align:center}
.brush{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:9px;border:2px solid transparent;cursor:pointer;font-weight:700;font-size:12.5px}
.brush.on{border-color:#0f172a;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.brush small{font-weight:500;opacity:.8}
.pg-host .tbl-pager{background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px}

/* ===== Bảng lương ===== */
.pl th.stk,.pl td.stk{position:sticky;background:#fff;z-index:1}
.pl thead th.stk{z-index:3;background:#f4f8f7}
.pl tfoot td.stk{z-index:3;background:#f4f8f7}
.pl tbody tr:hover td.stk{background:var(--p50)}
.pl td.in input{width:104px;height:30px;border:1px solid #cbd5d3;border-radius:7px;text-align:right;padding:0 7px;font-variant-numeric:tabular-nums;background:#fffbeb}
.pl td.in input:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px var(--p100)}
.pl td.net{font-weight:700;color:var(--pd)}
.pl th.grp{background:var(--p50);color:var(--pd);text-align:center}
.calc-out div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed #e8eeed;gap:10px}
.calc-out div b{font-variant-numeric:tabular-nums}
.calc-out .big{font-size:18px;color:var(--pd)}
.bac td input{width:100%;height:30px;border:1px solid #cbd5d3;border-radius:7px;padding:0 8px;text-align:right}

/* ===== Màn hình nhỏ ===== */
@media(max-width:1100px){.c2,.c3,.c4,.c21{grid-template-columns:minmax(0,1fr)}.c4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.c4{grid-template-columns:minmax(0,1fr)}.top-in{padding:10px 14px}.main{padding:14px}.tabs{order:3;flex-basis:100%;margin-left:0}.top-r{margin-left:auto}.form,.form.f3{grid-template-columns:minmax(0,1fr)}.field.s2{grid-column:auto}.search input{width:190px}.ss{display:none}}

/* ===== Menu dọc bên trái ===== */
.shell{display:flex;min-height:100vh}
.side{width:244px;flex:none;background:linear-gradient(180deg,var(--ink),var(--pd));color:#fff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:60}
.side .brand{padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.12)}
.side .tabs{flex-direction:column;margin:0;padding:10px;overflow-y:auto;overflow-x:hidden;gap:3px;flex:1}
.side .tabs a{padding:11px 13px}
.side-foot{padding:14px;border-top:1px solid rgba(255,255,255,.12)}
.side-foot .ss{max-width:none;margin-bottom:10px;display:flex!important}
.side-foot .btn{width:100%;justify-content:center}
.side-foot .credit{margin-top:10px;font-size:11px;color:#99f6e4;text-align:center;line-height:1.5}
.col{flex:1;min-width:0}
.col .main{max-width:none;margin:0}
.col .foot{max-width:none}
.mbar{display:none}
@media(max-width:900px){
  .side{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .2s}
  body.nav-open .side{transform:none}

const nh = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/gi, 'd').toLowerCase().replace(/[^a-z0-9]/g, '');

function eDate(v) {

  if ((m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/))) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;

}

function empParse(rows, fromPaste) {
  rows = rows.filter(r => r && r.some(c => String(c ?? '').trim() !== ''));
  let hr = -1, map = {};
  for (let r = 0; r < Math.min(rows.length, 20) && hr < 0; r++) {
    const m = {}; rows[r].forEach((h, i) => { const n = nh(h), c = EIMP.find(c => c.alias.includes(n)); if (c && m[c.key] === undefined) m[c.key] = i; });
    if (m.ten !== undefined) { hr = r; map = m; }
  }
  if (hr < 0) { if (!fromPaste) throw new Error('Không thấy cột "Họ và tên" trong file. Hãy tải file mẫu về để điền cho đúng'); EIMP.forEach((c, i) => map[c.key] = i); }
  const out = [], seen = new Set(); let auto = 0;
  DB.employees.forEach(e => { const n = parseInt(String(e.ma).replace(/\D/g, '')) || 0; if (n > auto) auto = n; });
  const nextMa = () => { let m; do m = 'NV' + String(++auto).padStart(3, '0'); while (DB.employees.some(e => e.ma === m) || seen.has(m)); return m; };
  rows.slice(hr + 1).forEach((r, k) => {
    const g = key => map[key] === undefined ? '' : r[map[key]], ten = String(g('ten') ?? '').trim(); if (!ten) return;
    const o = { id: 'i' + k, dong: hr + k + 2, has: {} };
    EIMP.forEach(c => { const v = g(c.key); o.has[c.key] = map[c.key] !== undefined && String(v ?? '').trim() !== ''; o[c.key] = c.t === 'money' || c.t === 'int' ? eNum(v) : c.t === 'date' ? eDate(v) : eText(c.key, v); });
    o.ten = ten;
    const gt = nh(o.gioiTinh); o.gioiTinh = gt.startsWith('nu') || gt === 'f' ? 'Nữ' : 'Nam';
    const tt = nh(o.trangThai); o.trangThai = tt.includes('thu') ? 'Thử việc' : tt.includes('nghi') ? 'Nghỉ việc' : 'Đang làm';

    if (seen.has(o.ma)) o.tt = 'trung'; else { seen.add(o.ma); o.cu = DB.employees.find(e => e.ma === o.ma); o.tt = o.cu ? 'cu' : 'moi'; }

}

      { t: 'Chấm công & làm thêm giờ', f: [{ key: 'congChuan', label: 'Công chuẩn / tháng', type: 'number' }, { key: 'gioCong', label: 'Số giờ / công', type: 'number' }, { key: 'heSoOT', label: 'Hệ số làm thêm giờ', type: 'number', hint: '1,5 ngày thường · 2 ngày nghỉ · 3 ngày lễ' }, { key: 'ccNghiToiDa', label: 'Chuyên cần: số ngày nghỉ tối đa', type: 'number', hint: 'Nghỉ không lương, nghỉ ốm (nửa ngày tính 0,5) vượt mức này thì mất phụ cấp chuyên cần. Nghỉ phép, nghỉ lễ không bị tính' }, { key: 'ngayNghi', label: 'Ngày nghỉ hằng tuần', type: 'select', options: [{ value: 'CN', label: 'Chủ nhật' }, { value: 'T7CN', label: 'Thứ 7 và Chủ nhật' }] }, { type: 'section', label: 'Từ 01/01/2026: toàn bộ tiền làm thêm giờ, làm ban đêm của người cư trú được miễn thuế TNCN (Luật Thuế TNCN 2025). Các tháng trước 2026 chỉ miễn phần chênh lệch so với lương giờ ban ngày.' }], o: s, cols: 2 },
      { t: 'Phòng ban', f: [{ key: 'pbText', label: 'Mỗi dòng một phòng ban', type: 'textarea', rows: 6, full: true }], o: { pbText: s.phongBan.join('\n') }, cols: 2, custom: o => { const v = o.pbText.split('\n').map(x => x.trim()).filter(Boolean); if (!v.length) { toast('Cần ít nhất 1 phòng ban', 'err'); return false; } s.phongBan = [...new Set(v)]; } },
      { t: 'Bảo hiểm bắt buộc (%)', f: [{ key: 'luongCoSo', label: 'Lương cơ sở từ 01/07/2026', type: 'money', hint: 'Trần BHXH, BHYT = 20 lần (2.530.000)' }, { key: 'luongCoSoCu', label: 'Lương cơ sở trước 01/07/2026', type: 'money', hint: '2.340.000. Dùng cho các tháng trước 07/2026' }, { key: 'ltVung', label: 'Lương tối thiểu vùng từ 01/01/2026', type: 'money', hint: 'Vùng I: 5.310.000. Trần BHTN = 20 lần' }, { key: 'ltVungCu', label: 'Lương tối thiểu vùng trước 2026', type: 'money', hint: 'Vùng I: 4.960.000' },
        { type: 'section', label: 'Người lao động đóng' }, { key: 'bhxhNLD', label: 'BHXH', type: 'number' }, { key: 'bhytNLD', label: 'BHYT', type: 'number' }, { key: 'bhtnNLD', label: 'BHTN', type: 'number' },
        { type: 'section', label: 'Doanh nghiệp đóng' }, { key: 'bhxhDN', label: 'BHXH (gồm TNLĐ-BNN)', type: 'number' }, { key: 'bhytDN', label: 'BHYT', type: 'number' }, { key: 'bhtnDN', label: 'BHTN', type: 'number' }, { key: 'kpcdDN', label: 'Kinh phí công đoàn', type: 'number' }], o: s, cols: 3 }
    ];
    el.innerHTML = `<div class="grid c2">${cards.map((c, i) => `<div class="card" data-sc="${i}"><div class="card-h"><h3>${c.t}</h3></div><div class="card-b">${formHTML(c.f, c.o, c.cols)}<div class="row mt"><button class="btn pri" data-scsave>${ic('check')} Lưu cài đặt</button></div></div></div>`).join('')}
      <div class="card" id="taxBox"><div class="card-h"><h3>Thuế TNCN (biểu lũy tiến từng phần)</h3></div><div class="card-b"><div class="form">${fieldHTML({ key: 'gtBanThan', label: 'Giảm trừ bản thân / tháng', type: 'money' }, s.gtBanThan)}${fieldHTML({ key: 'gtNPT', label: 'Giảm trừ mỗi người phụ thuộc', type: 'money' }, s.gtNPT)}</div>
        <table class="tbl compact bac mt"><thead><tr><th>Bậc</th><th class="r">Thu nhập tính thuế đến (đồng/tháng)</th><th class="r">Thuế suất %</th></tr></thead><tbody>${s.bac.map((b, i) => `<tr><td>${i + 1}</td><td><input data-money data-bd="${i}" value="${b.den ? F.money(b.den) : ''}" placeholder="Không giới hạn"></td><td><input type="number" data-bt="${i}" value="${b.ts}"></td></tr>`).join('')}</tbody></table>
        <p class="small muted">Mặc định theo quy định từ kỳ tính thuế 2026: giảm trừ 15,5 triệu, người phụ thuộc 6,2 triệu, biểu 5 bậc 5% · 10% · 20% · 30% · 35%. Khi luật đổi, sửa ở đây là bảng lương tự tính lại.</p>
        <div class="row"><button class="btn pri" data-act="taxSave">${ic('check')} Lưu cài đặt thuế</button><button class="btn" data-act="taxReset">${ic('refresh')} Về mặc định 2026</button></div></div></div></div>`;
    $$('[data-sc]', el).forEach(box => {
      const c = cards[+box.dataset.sc];
      box.querySelector('[data-scsave]').onclick = () => {
        if (c.f.some(f => f.required) && !checkForm(box, c.f)) return;
        const v = readForm(box, c.f);
        if (c.custom) { if (c.custom(v) === false) return; } else Object.assign(c.o, v);
        App.changed(false); toast('Đã cập nhật cài đặt', 'ok');
      };
    });
  }
};
Object.assign(ACT, {
  taxSave: () => {
    const box = $('#taxBox'), s = S();
    s.gtBanThan = F.parse(box.querySelector('[name=gtBanThan]').value); s.gtNPT = F.parse(box.querySelector('[name=gtNPT]').value);
    s.bac = s.bac.map((b, i) => ({ den: F.parse(box.querySelector(`[data-bd="${i}"]`).value), ts: parseFloat(box.querySelector(`[data-bt="${i}"]`).value) || 0 }));
    App.changed(false); toast('Đã lưu cài đặt thuế', 'ok');
  },
  taxReset: () => { const d = defaultSettings(); Object.assign(S(), { gtBanThan: d.gtBanThan, gtNPT: d.gtNPT, bac: d.bac }); App.changed(); }
});

/* ---------- Màn hình: Dữ liệu & sao lưu ---------- */
const vData = {
  title: 'Dữ liệu & sao lưu', label: 'Dữ liệu', icon: 'db', desc: 'Lưu file, sao lưu, khôi phục, làm mới dữ liệu', print: false,
  render(el) {
    el.innerHTML = `<div class="grid c2">
      ${card('Lưu dữ liệu vào chính file này', `<p class="muted" style="margin-top:0">Toàn bộ dữ liệu nằm ngay trong file <b>${esc(Store.fileName())}</b>. Bấm <b>Lưu vào file</b> (hoặc Ctrl + S) để ghi đè dữ liệu mới. Gửi file này cho người khác là gửi kèm cả dữ liệu.</p>
        <ol class="small" style="padding-left:18px;line-height:1.8"><li>Lần đầu: chọn đúng file đang mở, bấm Save, chọn Replace.</li><li>Các lần sau: bấm Lưu là xong, không hỏi lại.</li><li>Nên mở bằng <b>Google Chrome</b> hoặc <b>Microsoft Edge</b> để ghi đè trực tiếp.</li></ol>
        <div class="row"><button class="btn pri" data-act="saveFile">${ic('save')} Lưu vào file</button><button class="btn" data-act="saveAs">${ic('copy')} Lưu thành file khác</button></div>`)}
      ${card('Tình trạng dữ liệu', `<div class="dl"><div><span>Nhân viên</span><b>${F.money(DB.employees.length)}</b></div><div><span>Tháng có chấm công</span><b>${F.money(Object.keys(DB.cham).length)}</b></div></div><p class="small muted">Lần lưu gần nhất: <b>${DB._meta.savedAt ? new Date(DB._meta.savedAt).toLocaleString('vi-VN') : 'chưa lưu'}</b></p>`)}
      ${card('Sao lưu & khôi phục', `<p class="muted" style="margin-top:0">Tải bản sao lưu (.json) để cất giữ, hoặc chuyển dữ liệu sang file mới.</p><div class="row"><button class="btn" data-act="backup">${ic('download')} Tải bản sao lưu</button><button class="btn" data-act="pickRestore">${ic('upload')} Khôi phục từ bản sao lưu</button><input type="file" accept=".json,application/json,.txt" id="restoreFile" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0"></div>`)}
      ${card('Làm mới dữ liệu', `<p class="muted" style="margin-top:0">Xóa dữ liệu mẫu để bắt đầu nhập dữ liệu thật. Thông tin công ty và cài đặt được giữ lại.</p><div class="row"><button class="btn danger" data-act="wipe">${ic('trash')} Xóa dữ liệu mẫu / xóa hết</button><button class="btn" data-act="loadSample">${ic('refresh')} Nạp lại dữ liệu mẫu</button></div>`)}
    </div>
    <div class="banner mt">${ic('alert')}<div class="grow">Tác giả <b>${AUTHOR.ten}</b> · Zalo <b>${AUTHOR.zalo}</b> · <a href="https://www.${AUTHOR.web}" target="_blank" rel="noopener">${AUTHOR.web}</a> · <a href="${AUTHOR.nhom}" target="_blank" rel="noopener">Vào nhóm Zalo nhận file mới và học Excel miễn phí</a></div></div>`;
    $('#restoreFile').onchange = e => {
      const f = e.target.files[0]; if (!f) return; e.target.value = '';
      const r = new FileReader(); r.onload = async () => {
        try { const d = JSON.parse(r.result); if (d._app && d._app !== 'tdt-luong') throw new Error('Bản sao lưu của ứng dụng khác'); if (!(await Modal.confirm('Thay toàn bộ dữ liệu hiện tại bằng bản sao lưu này?', { ok: 'Khôi phục' }))) return; delete d._app; DB = d; DB._meta = DB._meta || {}; migrate(DB); App.changed(); toast('Đã khôi phục. Bấm "Lưu vào file" để ghi vào file.', 'ok'); }
        catch (err) { toast('File sao lưu không hợp lệ: ' + esc(err.message), 'err'); }
      }; r.readAsText(f);
    };
  }
};
Object.assign(ACT, {
  pickRestore: () => { try { $('#restoreFile').click(); } catch (e) { toast('Trình duyệt chặn cửa sổ chọn file. Hãy mở file bằng Chrome hoặc Edge trực tiếp trên máy.', 'err', 6000); } },
  saveFile: () => Store.save(), saveAs: () => Store.save(true),
  backup: () => download(new Blob([JSON.stringify(Object.assign({ _app: 'tdt-luong' }, DB), null, 1)], { type: 'application/json' }), `Sao luu Cham cong Tinh luong ${D.today()}.json`),
  wipe: async () => { if (!(await Modal.confirm('Xóa toàn bộ dữ liệu (giữ lại thông tin công ty và cài đặt)?', { ok: 'Xóa hết', danger: true }))) return; const keep = DB.settings; DB = emptyDB(); DB.settings = keep; DB._meta = {}; migrate(DB); $('#draftBox').innerHTML = ''; App.changed(); toast('Đã xóa. Nhớ bấm "Lưu vào file".', 'ok'); },
  loadSample: async () => { if (!(await Modal.confirm('Thay dữ liệu hiện tại bằng dữ liệu mẫu?', { ok: 'Nạp mẫu', danger: true }))) return; const keep = DB.settings.company; DB = sampleDB(); DB.settings.company = keep; DB._meta = {}; App.changed(); },
  navOpen: () => document.body.classList.add('nav-open'), navClose: () => document.body.classList.remove('nav-open'), bannerClose: (d, b) => b.closest('.banner').remove(),
  draftUse: () => { const d = Store.draft(); if (d) { DB = d.data; migrate(DB); Store.dirty = true; Store.status(); $('#draftBox').innerHTML = ''; App.render(); toast('Đã khôi phục. Bấm "Lưu vào file" để ghi hẳn vào file.', 'ok'); } },
  draftDrop: () => { try { localStorage.removeItem(Store.key()); } catch (e) { } $('#draftBox').innerHTML = ''; },
  viewExcel: () => App.views[App.cur].excel(),
  viewPrint: () => { const v = App.views[App.cur]; typeof v.print === 'function' ? v.print() : Print.view(); }
});

/* ---------- Khung ứng dụng ---------- */
const App = {
  cur: null, subtitle: '',
  views: { dashboard: vDash, chamcong: vCham, nhanvien: vEmp, bangluong: vLuong, thue: vThue, caidat: vSet, data: vData },
  order: ['dashboard', 'chamcong', 'nhanvien', 'bangluong', 'thue', 'caidat', 'data'],
  init() {
    Store.load();
    $('#app').innerHTML = `<div class="shell"><aside class="side"><div class="brand"><div class="logo">${ic('calcheck')}</div><div><b>Chấm công & Tính lương</b><small>Tác giả: ${AUTHOR.ten}</small></div></div>
      <nav class="tabs">${App.order.map(id => { const v = App.views[id]; return `<a data-nav="${id}">${ic(v.icon)}<span>${v.label || v.title}</span></a>`; }).join('')}</nav>
      <div class="side-foot"><span class="ss" id="saveState"><i></i><span></span></span><button class="btn pri" data-act="saveFile">${ic('save')} Lưu vào file</button><div class="credit">Zalo ${AUTHOR.zalo}<br>${AUTHOR.web}</div></div></aside><div class="backdrop" data-act="navClose"></div>
      <div class="col"><div class="mbar"><button class="ibtn" data-act="navOpen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>Chấm công & Tính lương</div>
      <main class="main"><div id="draftBox"></div><div class="ph"><div><h1 id="vTitle"></h1><p id="vDesc"></p></div><div class="tools" id="vTools"></div></div><div id="view"></div></main>
      <div class="foot">Thiết kế bởi <b>${AUTHOR.ten}</b> · Zalo ${AUTHOR.zalo} · ${AUTHOR.web}</div></div></div>`;
    $('#app').addEventListener('click', e => { const a = e.target.closest('[data-nav]'); if (a) { e.preventDefault(); App.go(a.dataset.nav); document.body.classList.remove('nav-open'); } });
    Store.status();
    const d = Store.draft();
    if (d) $('#draftBox').innerHTML = `<div class="banner warn">${ic('alert')}<div class="grow"><b>Có dữ liệu chưa lưu vào file</b> từ lần làm việc trước (${new Date(d.at).toLocaleString('vi-VN')}).</div><button class="btn sm pri" data-act="draftUse">Khôi phục</button><button class="btn sm" data-act="draftDrop">Bỏ qua</button></div>`;
    else if (DB._meta.sample) $('#draftBox').innerHTML = `<div class="banner">${ic('alert')}<div class="grow">File đang có <b>dữ liệu mẫu</b> để xem thử. Khi dùng thật: vào tab <a data-nav="data" href="#">Dữ liệu</a>, bấm "Xóa dữ liệu mẫu" rồi nhập dữ liệu của bạn.</div><button class="ibtn" data-act="bannerClose">${ic('x')}</button></div>`;
    window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && h !== App.cur && App.views[h]) App.go(h); });
    const start = (location.hash || '').slice(1); App.go(App.views[start] ? start : 'dashboard');
  },
  go(id) {
    if (!App.views[id]) id = 'dashboard';
    App.cur = id; history.replaceState(null, '', '#' + id);
    $$('.tabs a').forEach(a => a.classList.toggle('on', a.dataset.nav === id));
    App.render(); window.scrollTo(0, 0);
  },
  render() {
    const v = App.views[App.cur]; App.subtitle = '';
    $('#vTitle').textContent = v.title; $('#vDesc').textContent = v.desc || '';
    const el = $('#view'); el.innerHTML = ''; v.render(el);
    $('#vTools').innerHTML = (v.tools ? v.tools() : '') + (v.excel ? `<button class="btn xl" data-act="viewExcel">${ic('sheet')} Xuất Excel</button>` : '') + (v.print !== false ? `<button class="btn" data-act="viewPrint">${ic('printer')} In</button>` : '');
    if (v.after) v.after(el);
    document.title = v.title + ' · Chấm công & Tính lương · ' + AUTHOR.ten;
  },
  changed(rerender = true) { Store.changed(); if (rerender) App.render(); }
};
App.init();
</script>
</body>
</html>
